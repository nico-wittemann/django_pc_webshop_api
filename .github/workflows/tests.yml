name: Run Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: shop_api_admin
          POSTGRES_PASSWORD: yourpassword
          POSTGRES_DB: django_pc_shop_api
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: app.settings
      DATABASE_ADMIN_PASSWORD: yourpassword
      SECRET_KEY: testsecretkey
      DEBUG: "True"
      DB_NAME: django_pc_shop_api
      DB_USER: shop_api_admin
      DB_PASSWORD: yourpassword
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Tests
        run: pytest --disable-warnings --maxfail=1
